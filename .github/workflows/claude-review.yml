name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude-review:
    # 자동 PR 리뷰 또는 @claude 수동 호출 시 실행
    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude')
      )

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # PR 이벤트에서 진행 상황 및 리뷰 코멘트 추적
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review the changes in this pull request.
            This repository is used for research data standardization.

            Before reviewing:
            1. Read CLAUDE.md for repository-specific instructions.
            2. Read STANDARDIZATION_RULE.md for detailed data standardization rules.

            Review the pull request for:
            - violations of the repository's standardization rules
            - file and folder structure issues
            - naming convention inconsistencies
            - inappropriate modification of raw data
            - reproducibility issues
            - potential problems in R scripts
            - missing or unclear documentation

            For data standardization, pay particular attention to:
            - whether the correct standard is applied for the data type
            - matrix orientation
            - expression value scale
            - cell line and sample naming
            - gene/protein identifier format
            - separation of metadata and annotation
            - processed/curated file naming rules

            Focus only on issues relevant to this repository.

            For every issue:
            - explain what is wrong
            - cite the relevant section of STANDARDIZATION_RULE.md or CLAUDE.md
            - explain how it should be corrected

            If you are not certain whether a change violates a rule,
            ask a question instead of treating it as a definite violation.

            Write the review in Korean.

            If this workflow was triggered by an @claude mention,
            focus primarily on what the user specifically requested.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"